name: "\u2728 Feature Request"
description: Suggest an idea or enhancement for the starter template
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for suggesting an enhancement! Please describe your proposed feature below.
  - type: textarea
    id: problem
    attributes:
      label: Is your feature request related to a problem?
      description: A clear and concise description of the limitation or problem.
      placeholder: "I'm always frustrated when..."
    validations:
      required: false
  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution / Architectural Suggestion
      description: Describe the solution you'd like to see implemented in the template.
      placeholder: "Add support for..."
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches or workarounds you considered.
    validations:
      required: false
  - type: checkboxes
    id: checklist
    attributes:
      label: Agreement
      options:
        - label: I confirm this aligns with the lightweight, scalable philosophy in AGENTS.md.
          required: true
